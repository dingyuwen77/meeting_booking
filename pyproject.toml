[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "adp-meeting-reservation"
version = "0.2.0"
description = "Tencent ADP MCP booking service with BizVideo provider"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21,<5",
  "httpx>=0.27,<1",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
meeting-contract = "meeting_reservation.cli:main"
meeting-mcp = "meeting_reservation.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeting_reservation = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
